<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Breaks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px; color: white; }
        h1 { text-align: center; margin-bottom: 24px; }
        .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
        .game { display: block; background: white; color: #4a3a8a; text-decoration: none; border-radius: 12px; padding: 24px; text-align: center; font-size: 1.3em; font-weight: bold; }
        .game:hover { background: #f0edff; }
    </style>
</head>
<body>
    <h1>🧠 Brain Breaks</h1>
    <div class="games">
        <a class="game" href="games/memory-match/">🧠 Memory Match</a>
        <a class="game" href="games/visual-timer/">⏱️ Visual Timer</a>
    </div>
</body>
</html>
