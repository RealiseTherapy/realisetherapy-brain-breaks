<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clap Tower - Brain Breaks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../../" class="back-button">← Back</a>
            <h1>👏 Clap Tower</h1>
        </div>

        <div class="hud">
            <div>Height: <b id="score">0</b></div>
            <div>Best: <b id="best">0</b></div>
            <div class="mic">🎤 <span class="meter"><span id="level"></span><span id="thr"></span></span></div>
            <label>Sensitivity <input id="sens" type="range" min="1" max="100" value="60"></label>
            <div id="beats" title="Beat counter (clap on 1)"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="stage">
            <canvas id="c"></canvas>
            <div id="overlay">
                <h2 id="title">👏 Clap Tower</h2>
                <p id="msg">Clap to stop the sliding block. Anything hanging over gets chopped off!</p>
                <p id="micStatus" class="status"></p>
                <p class="status" id="trackStatus">No backing track loaded (free mode).</p>
                <label class="secondary file">🎵 Choose 100 BPM track <input id="track" type="file" accept="audio/*" hidden></label>
                <label class="offset">Sync nudge <input id="offset" type="number" step="10" min="-500" max="500" value="0"> ms</label>
                <button id="enableMic">🎤 Enable microphone</button>
                <button id="start" hidden>▶ Start</button>
                <button id="startNoMic" class="secondary">Play without microphone</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
