<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setupScreen" class="screen setup-screen">
    <h1>Memory Match</h1>

    <div class="setup-card">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <div class="teams-control">
        <button id="decreaseTeamsBtn" type="button">-</button>
        <div>Teams: <span id="teamCount">2</span></div>
        <button id="increaseTeamsBtn" type="button">+</button>
      </div>

      <div id="teamList"></div>

      <button id="startGameBtn" type="button">Start Game</button>
    </div>
  </div>

  <div id="gameScreen" class="screen game-screen" style="display:none;">
    <div class="top-bar">
      <button id="resetBtn" type="button">Reset</button>
      <div>Moves: <span id="moves">0</span></div>
      <div>Matches: <span id="matches">0</span></div>
    </div>

    <div id="currentTeamIndicator"></div>
    <div id="scoreboard" class="scoreboard"></div>
    <div id="gameBoard" class="game-board"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
